# Sub-Store (Portainer Git stack). Frontend + backend in one container on 3001,
# exposed only to 127.0.0.1; Caddy serves https://sub.njcq.dpdns.org.
# SUB_STORE_FRONTEND_BACKEND_PATH (secret path, starts with /) comes from Portainer stack env.
services:
  sub-store:
    image: xream/sub-store:latest
    container_name: sub-store
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - SUB_STORE_BACKEND_SYNC_CRON=0 0 * * *
      - SUB_STORE_CORS_ALLOWED_ORIGINS=https://sub.njcq.dpdns.org
      - SUB_STORE_FRONTEND_BACKEND_PATH=${SUB_STORE_FRONTEND_BACKEND_PATH}
    volumes:
      - sub_store_data:/opt/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sub_store_data:
    name: sub_store_data
